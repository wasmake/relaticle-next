services:
  web:
    build:
      context: .
      target: production
    image: ghcr.io/wasmake/relaticle-next:latest
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      APP_NAME: ${APP_NAME:-Relaticle Next}
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_KEY: ${APP_KEY:-}
      APP_PREVIOUS_KEYS: ${APP_PREVIOUS_KEYS:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      APP_PANEL_DOMAIN: ${APP_PANEL_DOMAIN:-}
      APP_PANEL_PATH: ${APP_PANEL_PATH:-app}
      SESSION_COOKIE: ${SESSION_COOKIE:-}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-relaticle}
      DB_USERNAME: ${DB_USERNAME:-relaticle}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_CACHE_DB: 1
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-bull}
      HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-2000}
      ACTIVITYLOG_ENABLED: ${ACTIVITYLOG_ENABLED:-true}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      RELATICLE_FEATURE_BILLING: ${RELATICLE_FEATURE_BILLING:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  worker:
    image: ghcr.io/wasmake/relaticle-next:latest
    restart: unless-stopped
    init: true
    command: ["node", "dist/worker/apps/worker/index.js"]
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_PANEL_DOMAIN: ${APP_PANEL_DOMAIN:-}
      APP_PANEL_PATH: ${APP_PANEL_PATH:-app}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-relaticle}
      DB_USERNAME: ${DB_USERNAME:-relaticle}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-bull}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Relaticle Next}
      RESEND_KEY: ${RESEND_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 60s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-relaticle}
      POSTGRES_USER: ${DB_USERNAME:-relaticle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    stop_grace_period: 30s

volumes:
  postgres:
  redis:
